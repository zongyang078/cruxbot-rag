[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cruxbot"
version = "0.1.0"
description = "A hybrid-retrieval RAG system over 338k rock climbing documents, with a measurable retrieval evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zongyang Li", email = "li.zongyang@northeastern.edu" }]

# The pure core (grades, intent, fusion, urls, prompts) has zero runtime
# dependencies, so CI can run its full test suite in seconds without pulling
# torch. Everything heavy is an optional extra, declared only once code in this
# repo actually imports it.
dependencies = []

[project.optional-dependencies]
# Retrieval stack: embeddings, vector store, sparse index, reranker.
rag = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]
# Serving layer.
serve = [
    # anthropic is a serving dependency, not only an evaluation one: the hosted
    # provider is the deployable generation path, and a container built without
    # it can only ever run the local backend.
    "anthropic>=0.70",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
]
# Data collection + cleaning pipeline.
ingest = [
    "requests>=2.31",
    "pandas>=2.2",
    "langchain-text-splitters>=0.2",
    "tqdm>=4.66",
]
# Evaluation harness: the relevance judge and its schema validation.
eval = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]
dev = [
    # httpx backs fastapi's TestClient, which the API tests use.
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a built index or a running LLM backend (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
