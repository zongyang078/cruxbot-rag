name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No torch, no chromadb: the retrieval and indexing modules are tested
      # through Protocols with in-memory doubles. The eval extra is light
      # (anthropic, pydantic, dotenv) and the judge tests need its schema.
      - name: Install
        run: pip install -e ".[dev,eval]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest -m "not integration" --cov=cruxbot --cov-report=term-missing
